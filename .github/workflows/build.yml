name: Build MediaWiki images

# 每个镜像有唯一标签 <MW 版本>-<配方哈希>（配方 = Dockerfile、components.json、config/、docker/）。
# 发布时只构建还不存在的组合，所以：
#   - 官方发布新的 MediaWiki 版本 → 定时任务自动构建
#   - 修改了配方（如在 components.json 增删扩展）并合入 main → 自动构建
#   - 其他情况（改文档、改工作流本身）→ 什么也不做
on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      force:
        description: "无条件重建（用于拉取 ref 为分支的组件的新提交，如 master）"
        type: boolean
        default: false
      series:
        description: "只构建这些系列，逗号分隔，如 1.46；留空表示全部跟踪的系列"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      has_jobs: ${{ steps.resolve.outputs.has_jobs }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build matrix
        id: resolve
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'test' || 'publish' }}
          IMAGE: ${{ steps.image.outputs.name }}
          FORCE: ${{ inputs.force || 'false' }}
          ONLY_SERIES: ${{ inputs.series || '' }}
        run: python3 scripts/resolve_versions.py

  build:
    name: MediaWiki ${{ matrix.mw_version }}
    needs: resolve
    if: needs.resolve.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    # 同一系列的发布串行执行，避免两个运行同时写同一组标签
    concurrency:
      group: publish-${{ matrix.series }}-${{ needs.resolve.outputs.publish }}
      cancel-in-progress: false
    env:
      PUBLISH: ${{ needs.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
        if: env.PUBLISH == 'true'

      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64) for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mediawiki-ci:test
          build-args: MW_VERSION=${{ matrix.mw_version }}
          cache-from: type=gha,scope=mw-${{ matrix.series }}
          cache-to: type=gha,scope=mw-${{ matrix.series }},mode=max

      - name: Smoke test (install a wiki, load every component, render a page)
        run: docker run --rm --entrypoint mw-smoke-test mediawiki-ci:test

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ matrix.tags }}
          build-args: MW_VERSION=${{ matrix.mw_version }}
          labels: |
            org.opencontainers.image.title=MediaWiki ${{ matrix.mw_version }}
            org.opencontainers.image.version=${{ matrix.mw_version }}-${{ matrix.recipe }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=mw-${{ matrix.series }}
          cache-to: type=gha,scope=mw-${{ matrix.series }},mode=max

      - name: Summary
        if: always()
        env:
          VERSION: ${{ matrix.mw_version }}
          TAGS: ${{ matrix.tag_list }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### MediaWiki ${VERSION}"
            if [ "$PUBLISH" = true ]; then
              echo "Tags: \`${TAGS}\`"
              echo "Digest: \`${DIGEST}\`"
            else
              echo "Test build only (not published)."
            fi
            echo
            echo '```'
            docker run --rm --entrypoint cat mediawiki-ci:test /etc/mediawiki-image/components.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
