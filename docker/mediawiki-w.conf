# Keep the standard MediaWiki script/resource URL available at /w/ while the
# image continues to serve the application from its normal document root.
RedirectMatch 301 ^/w$ /w/
Alias /w/ /var/www/html/

# Route article URLs through MediaWiki. Keep the original path available to
# MediaWiki by rewriting to the script URL without adding a title query.
RewriteEngine On
RewriteRule ^/?wiki(/.*)?$ /w/index.php [L]

<Directory /var/www/html/>
	Options FollowSymLinks
	AllowOverride All
	Require all granted
</Directory>
