server {
    listen 80;
    server_name _;
    root /var/www/html;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /w {
        return 301 /w/;
    }

    # The image stores MediaWiki at the document root. The symlink created in
    # the Dockerfile makes the public /w/ script/resource URL resolve there.
    location /w/ {
        try_files $uri =404;
    }

    # Only MediaWiki's public entry points may be executed by PHP-FPM.
    location ~ ^/w/(?<mw_script>(?:mw-config/)?(?:index|load|api|thumb|opensearch_desc|rest|img_auth)\.php)(?<mw_path_info>/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/$mw_script;
        fastcgi_param SCRIPT_NAME /w/$mw_script;
        fastcgi_param PATH_INFO $mw_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Never serve arbitrary PHP files, including LocalSettings.php.
    location ~ ^/w/.*\.php(?:/|$) {
        return 404;
    }

    # MediaWiki short URLs. The original request URI is retained for PHP via
    # $request_uri, allowing MediaWiki to resolve the article title itself.
    location /wiki/ {
        rewrite ^/wiki/.*$ /w/index.php last;
    }

    location = / {
        return 301 /wiki/Main_Page;
    }

    location / {
        return 404;
    }
}
